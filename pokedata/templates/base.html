<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Damage Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eceef2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    nav { background: #24242f; display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.75rem; padding: 1rem 1.5rem; }
    nav a { color: #d8d8e0; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    nav a:hover { color: #ffffff; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'damage_calculator' %}">Damage Calculator</a>
    <a href="{% url 'pokemon_table' %}">Pokémon Table</a>
    <a href="{% url 'team_builder' %}">Team Builder</a>
  </nav>

  {% block content %}
  {% endblock %}
</body>
</html>
